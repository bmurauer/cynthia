; PlatformIO Project Configuration File
;
; Conductor firmware for #05 midi_to_cv, running on the RP2040 Pico module
; on conductor_main. Uses the earlephilhower arduino-pico core so the
; existing fortyseveneffects MIDI library (already used in
; kosmo_modular_midi_2_cv) can be reused, and so the two MIDI inputs that
; don't sit on real UART RX pins can use SerialPIO instead of a hand-written
; PIO program.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
; PlatformIO's own "raspberrypi" platform bundles Arduino's mbed-based
; RP2040 core, which has no SerialPIO and no per-UART pin remapping. The
; earlephilhower core this firmware needs is pulled in via this community
; platform fork instead - this is the installation method documented at
; https://arduino-pico.readthedocs.io/en/latest/platformio.html. Note the
; board id is "rpipico", not "pico" - the latter still selects the
; mbed-based core within this same platform fork.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino

lib_deps = fortyseveneffects/MIDI Library@^5.0.2

monitor_speed = 115200
