; PlatformIO Project Configuration File
;
; Firmware for the #05 melodic player (STM32G030F6, TSSOP-20). Listens to the
; player bus (raw MIDI at 250000 baud on PB7), writes note and velocity CV to
; an MCP4822 over SPI1, drives the gate, and learns its MIDI channel from the
; learn button. Pin mapping is in src/main.cpp. Flashed over SWD with an
; ST-Link through the player SWD adapter.
;
; PlatformIO ships no G030 board, so boards/genericSTM32G030F6.json defines one,
; pointing at the STM32duino core's "G030F6P" variant. That variant clocks the
; chip from the internal HSI at 64MHz, so no crystal is needed.
;
; Two environments, differing only in gate polarity:
;   pcb        - the real board, where Q1 inverts the gate (default)
;   breadboard - LED + 1k to GND directly on PA3, not inverted
; Flash the breadboard with: pio run -e breadboard -t upload
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pcb

[env]
platform = ststm32
board = genericSTM32G030F6
framework = arduino

; The last 2KB flash page (page 15, 0x08007800) holds the learned settings.
; Shrinking the linker's flash region to 30KB keeps code out of it - the build
; fails at link time instead of the firmware silently overlapping the page.
board_upload.maximum_size = 30720

upload_protocol = stlink
debug_tool = stlink

; Same MIDI library as the conductor firmware.
lib_deps = fortyseveneffects/MIDI Library@^5.0.2

[env:pcb]
build_flags = -DGATE_INVERTED=1

[env:breadboard]
build_flags = -DGATE_INVERTED=0
